# SwiftLint Configuration for XCUITestFramework
# https://github.com/realm/SwiftLint

# Paths to include/exclude
included:
  - XCUITestFramework
  - XCUITestFrameworkTests

excluded:
  - Pods
  - DerivedData
  - .build
  - Apps

# Disable specific rules
disabled_rules:
  - trailing_whitespace
  - todo
  - line_length  # Disabled because some log messages can be long

# Opt-in rules (not enabled by default)
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

# Analyzer rules (requires full compilation)
analyzer_rules:
  - unused_declaration
  - unused_import

# Rule configurations
file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

nesting:
  type_level:
    warning: 2
    error: 3

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - URL
    - url
    - app
    - x
    - y

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

large_tuple:
  warning: 3
  error: 4

# Force cast rules
force_cast: warning
force_try: warning
force_unwrapping: warning

# Custom rules
custom_rules:
  print_usage:
    name: "Print Usage"
    regex: '(?<!//\s)print\('
    match_kinds:
      - identifier
    message: "Use framework logging instead of print() for production code"
    severity: warning

  multiple_empty_lines:
    name: "Multiple Empty Lines"
    regex: '\n\n\n+'
    message: "Maximum one empty line allowed"
    severity: warning

  explicit_failure_calls:
    name: "Explicit Failure Calls"
    regex: 'XCTFail\(\)'
    message: "Provide a failure message to XCTFail()"
    severity: warning

# Reporting
reporter: "xcode" # Options: xcode, json, csv, checkstyle, codeclimate, junit, html, emoji, sonarqube, markdown, github-actions-logging

# Severity levels
# warning: Issue should be fixed but doesn't break the build
# error: Issue must be fixed, breaks the build
